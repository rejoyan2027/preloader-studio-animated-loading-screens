name: Publish Preloader Studio to WordPress.org

# Publish a GitHub Release with tag 2.6.5 to deploy that exact version.
# This avoids accidentally publishing development changes on each push.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy the tagged release
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up PHP for syntax validation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate version and plugin package
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "ERROR: Use a numeric tag such as 2.6.5, not v2.6.5."
            exit 1
          fi
          test -f preloader-studio.php
          test -f readme.txt
          test -f SOURCE-README.txt
          grep -Fqx "Stable tag: $RELEASE_VERSION" readme.txt
          grep -Fq " * Version: $RELEASE_VERSION" preloader-studio.php
          grep -Fq "Contributors: codelith" readme.txt
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n 1 php -l > /tmp/preloader-php-lint.log
          find assets/js -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
          echo "PHP and JS syntax checks passed; release version matches."

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: preloader-studio-animated-loading-screens
